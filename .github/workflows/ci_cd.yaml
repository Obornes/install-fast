name: CI/CD

on:
  pull_request:
    branches:
      - 'main'

env:
  DOCKER_CLI_EXPERIMENTAL: enabled
  FAST_VERSION: "latest"  # Change this to the desired version or leave it empty or with word "latest" for the latest version

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/checkout@v4

      - name: Install Fast (Specific Version)
        run: curl -fsSL https://raw.githubusercontent.com/Obornes/install-fast/main/install_fast_linux.sh | bash -s $FAST_VERSION

      - name: Verify Fast Installation
        run: fast self:version  # Should print 0.5.5-beta

